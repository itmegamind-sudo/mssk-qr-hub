<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matsusaka Teppanyaki</title>
    
    <!-- Google Fonts: Battambang -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f1edea;
            --card-bg: #162033;
            --accent: #f59e0b;
            --border-color: #233554;
            --text-dark: #111827;
            --text-sub: #64748b;
            --text-btn: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Battambang", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            padding: 3.5rem 1.25rem 2.5rem;
            min-height: 100vh;
            position: relative;
        }

        /* Top Right Language Dropdown */
        .top-nav {
            position: absolute;
            top: 1rem;
            right: 1.25rem;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .lang-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: #ffffff;
            color: #1e293b;
            font-family: "Battambang", sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 32px 6px 14px;
            border-radius: 20px;
            border: 1.5px solid #cbd5e1;
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2214%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2364748b%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            transition: border-color 0.2s ease;
        }

        .lang-select:focus {
            border-color: var(--accent);
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.15rem;
        }

        /* Frameless Clean Logo */
        .brand-logo {
            width: auto;
            max-width: 170px;
            max-height: 110px;
            height: auto;
            object-fit: contain;
            border-radius: 0;
            border: none;
            box-shadow: none;
            background: transparent;
            display: block;
            margin: 0 auto;
			mix-blend-mode: multiply; /* Removes the white box */
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-dark);
            text-align: center;
            line-height: 1.3;
        }

        /* Real-time Clock & Date */
        .datetime-box {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(22, 32, 51, 0.85);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
        }

        .live-date {
            color: #cbd5e1;
            font-weight: 500;
        }

        .datetime-separator {
            color: #64748b;
        }

        .live-time {
            font-weight: 700;
            color: var(--accent);
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Menu Links */
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: var(--card-bg);
            color: var(--text-btn) !important;
            text-decoration: none;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .link-btn:active {
            transform: scale(0.98);
        }

        .link-btn:hover {
            border-color: var(--accent);
        }

        .tag {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--accent);
            line-height: 1.3;
        }

        .label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-btn) !important;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <!-- Top-Right Language Switcher -->
    <div class="top-nav">
        <select id="lang-select" class="lang-select" onchange="switchLanguage(this.value)">
			<option value="en">🌐 English</option>
			<option value="km">🌐 ភាសាខ្មែរ</option>
			<option value="zh">🌐 中文</option>
		</select>
    </div>

    <div class="container">
        <!-- Frameless Logo -->
        <img src="mssk-logo.png" alt="MSSK Logo" class="brand-logo">

        <h1>Matsusaka Teppanyaki</h1>

        <!-- Live Clock & Date -->
        <div class="datetime-box">
            <span id="live-date" class="live-date">Loading date...</span>
            <span class="datetime-separator">|</span>
            <span id="live-time" class="live-time">--:--:--</span>
        </div>      

        <!-- Menu Links Group -->
        <div class="links-group">            
            <a href="https://heyzine.com/flip-book/84b404df5c.html" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-lunch">Teppanyaki Menu</span>
                <span class="label" id="l-lunch">🍲 Main Course</span>
            </a>
			<a href="https://heyzine.com/flip-book/e312759729.html" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-lunch">Japanese Drink</span>
                <span class="label" id="l-lunch">🍲 Drink Menu</span>
            </a>			
            <a href="https://www.facebook.com/Matsusakateppanyaki/" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-fb">FACEBOOK PAGE</span>
                <span class="label" id="l-fb">📘 Facebook</span>
            </a>
            <a href="https://www.instagram.com/gyumiya.kh" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-ig">INSTAGRAM PROFILE</span>
                <span class="label" id="l-ig">📷 Instagram</span>
            </a> href="https://maps.app.goo.gl/KGU7PC6dA1nsVwvG6" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-map">60M-MSSK MAP</span>
                <span class="label" id="l-map">📍 Map</span>
            </a>			
        </div>
    </div>

    <script>
    let currentLang = 'en';

    const translations = {
        en: {
            locale: 'en-US',
            t_menu: 'Japanese Menu & Drink',
            l_menu: '🍲 Main & Drink',
            t_fb: 'FACEBOOK PAGE',
            l_fb: '📘 Facebook',
            t_ig: 'INSTAGRAM PROFILE',
            l_ig: '📷 Instagram',
            t_map60m: '60M-GMY MAP',
            l_map60m: '📍 Map',
            t_mapshv: 'SHV-GMY MAP',
            l_mapshv: '📍 Map'
        },
        km: {
            locale: 'km-KH',
            t_menu: 'មីនុយជប៉ុន និងភេសជ្ជៈ',
            l_menu: '🍲 ម្ហូប និងភេសជ្ជៈ',
            t_fb: 'ទំព័រហ្វេសប៊ុក',
            l_fb: '📘 Facebook',
            t_ig: 'ទំព័រអុីនស្តាក្រាម',
            l_ig: '📷 Instagram',
            t_map60m: 'ផែនទីសាខា ផ្លូវ 60M',
            l_map60m: '📍 ទីតាំង',
            t_mapshv: 'ផែនទីសាខា កំពង់សោម (SHV)',
            l_mapshv: '📍 ទីតាំង'
        },
        zh: {
            locale: 'zh-CN',
            t_menu: '日式料理与饮品菜单',
            l_menu: '🍲 主食与饮品',
            t_fb: '脸书专页',
            l_fb: '📘 Facebook',
            t_ig: 'Instagram 主页',
            l_ig: '📷 Instagram',
            t_map60m: '60M 门店地图',
            l_map60m: '📍 查看地图',
            t_mapshv: '西港 门店地图 (SHV)',
            l_mapshv: '📍 查看地图'
        }
    };

    function updateText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
    }

    function switchLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        const t = translations[lang];

        // Update all 5 buttons
        updateText('t-menu', t.t_menu);
        updateText('l-menu', t.l_menu);
        updateText('t-fb', t.t_fb);
        updateText('l-fb', t.l_fb);
        updateText('t-ig', t.t_ig);
        updateText('l-ig', t.l_ig);
        updateText('t-map60m', t.t_map60m);
        updateText('l-map60m', t.l_map60m);
        updateText('t-mapshv', t.t_mapshv);
        updateText('l-mapshv', t.l_mapshv);

        // Keep dropdown select in sync
        const dropdown = document.getElementById('lang-select');
        if (dropdown) dropdown.value = lang;

        updateLiveDateTime();
    }

    window.setLanguage = switchLanguage;

    function updateLiveDateTime() {
        const now = new Date();
        const loc = (translations[currentLang] && translations[currentLang].locale) || 'en-US';

        const dateEl = document.getElementById('live-date');
        if (dateEl) {
            dateEl.textContent = now.toLocaleDateString(loc, { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        const timeEl = document.getElementById('live-time');
        if (timeEl) {
            timeEl.textContent = now.toLocaleTimeString(loc, { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            });
        }
    }

    updateLiveDateTime();
    setInterval(updateLiveDateTime, 1000);
</script>
</body>
</html>
